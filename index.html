<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: #fff;
        }

        .card-custom {
            background: #2f2f4f;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-start {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .name-start {
            background: linear-gradient(10deg, #00c6ff, #0072ff);
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,114,255,0.7);
        }

        #webcam-container canvas {
            width: 100% !important;
            border-radius: 15px;
        }

        .progress {
            height: 25px;
            border-radius: 15px;
            background-color: #444;
        }

        .progress-bar {
            font-weight: bold;
        }

        .label-title {
            font-size: 14px;
            margin-bottom: 3px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card-custom col-12 col-md-8 col-lg-6 text-center">
        <div class="name-start"> Douglas Rodrigues Santos</div>

        <h2 class="mb-4">Reconhecimento com IA</h2>

        <button class="btn btn-start mb-4" onclick="init()">
            🎥 Ativar Câmera
        </button>

        <div id="webcam-container" class="mb-4"></div>

        <div id="label-container"></div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/2RAgctNq1/";

let model, webcam, labelContainer, maxPredictions;

async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    const flip = true;
    webcam = new tmImage.Webcam(350, 350, flip);

    await webcam.setup();
    await webcam.play();
    window.requestAnimationFrame(loop);

    const webcamContainer = document.getElementById("webcam-container");
    webcamContainer.innerHTML = "";
    webcamContainer.appendChild(webcam.canvas);

    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";

    for (let i = 0; i < maxPredictions; i++) {
        const wrapper = document.createElement("div");
        wrapper.classList.add("mb-3");

        const label = document.createElement("div");
        label.classList.add("label-title");

        const progress = document.createElement("div");
        progress.classList.add("progress");

        const bar = document.createElement("div");
        bar.classList.add("progress-bar");
        bar.style.width = "0%";
        bar.innerText = "0%";

        progress.appendChild(bar);
        wrapper.appendChild(label);
        wrapper.appendChild(progress);

        labelContainer.appendChild(wrapper);
    }
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);

    for (let i = 0; i < maxPredictions; i++) {
        const prob = prediction[i].probability;
        const percent = (prob * 100).toFixed(1);

        const wrapper = labelContainer.childNodes[i];
        const label = wrapper.childNodes[0];
        const bar = wrapper.childNodes[1].childNodes[0];

        label.innerHTML = prediction[i].className;

        bar.style.width = percent + "%";
        bar.innerHTML = percent + "%";

        if (percent > 70) {
            bar.className = "progress-bar bg-success";
        } else if (percent > 40) {
            bar.className = "progress-bar bg-warning";
        } else {
            bar.className = "progress-bar bg-danger";
        }
    }
}
</script>

</body>
</html>
